name: Build Harbour APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Harbour.apk

      # Each build is published as a preview. Only the PC emulator copy (with "Preview builds"
      # switched on) sees it. The "Release a build" workflow promotes it so the tablet updates.
      - name: Publish preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Harbour build ${{ github.run_number }} (preview)
          body: Preview build. Run the "Release a build" workflow to send it to the tablet.
          files: Harbour.apk
          prerelease: true
          make_latest: false
