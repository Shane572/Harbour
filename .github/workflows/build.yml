name: Build Harbour APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Release builds run much faster than debug ones; both use the same committed key.
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Harbour.apk

      # Each build is released straight away, so the tablet's Update button offers it.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Harbour build ${{ github.run_number }}
          body: Harbour updates itself from here. For a first install, download Harbour.apk below and open it on your tablet.
          files: Harbour.apk
          make_latest: true
